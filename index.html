<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Waypoint – Your work. Your direction.</title>
    <meta name="description" content="Waypoint by Next Technology. Plan your tasks, track your progress and reach what's next with boards, roadmaps, comments, attachments and due-date notifications." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Waypoint" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; media-src 'self' data: blob:;" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          // One-time migration of storage keys from the previous "Worklane" brand.
          [localStorage, sessionStorage].forEach(function(store) {
            for (var i = store.length - 1; i >= 0; i--) {
              var key = store.key(i);
              if (key && key.indexOf('worklane') === 0) {
                var next = 'waypoint' + key.slice(8);
                if (store.getItem(next) === null) store.setItem(next, store.getItem(key));
                store.removeItem(key);
              }
            }
          });
        } catch (e) {}
        try {
          var saved = localStorage.getItem('waypoint-theme');
          var parsed = saved ? JSON.parse(saved) : null;
          var isDark = parsed && parsed.state ? !!parsed.state.isDark : true;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
